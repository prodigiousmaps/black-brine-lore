# Broadside Tavern

## Overview
The Broadside Tavern is more than a watering hole—it is a gaming call, ale house and steamy bath house all in one. Known for its multilevel drinking hall and nightly performances, it draws pirates, nobles, informants, and adventurers alike into its orbit.

## Geography
Located in the northern district of Little Sedna, the Broadside is accessible by main street and dockside. Its ancient interior features a gaming floor lined with well worn tables where citizens gather to play games of chance, strategy and skill. A high mezzanine overlooks the gaming floor for those who prefer music and drinking.

## Notable Features
- **The Mezzanine Stage**: Hosts bards, illusionists, and playwrights. Performances often double as coded exchanges or fronts for clandestine dealings.
- **The Bath House**: Fed by hot springs, the bath house is a luxureous destination offering steaming baths, perfumed soaps and restorative oils.
- **The Tideglass Bar**: Renowned for rare spirits and fine liqueurs. The bar’s polished surface gleams like the midnight sea, reflecting faces with uncanny clarity.
- **Neutral Ground**: Accepted as a political chessboard where pirate captains, council informants, and power brokers negotiate under a fragile veneer of discretion.

## Demographics
Patrons vary nightly—pirates, merchants, nobles in disguise, foreign emissaries, and adventurers. Staff is small but skilled, led by Lira Vott and Baelin the Quiet.

## Government & Politics
The tavern operates as neutral ground, respected by rival gangs and factions. Agreements made here often carry weight across the city, enforced by the threat of collective retribution if neutrality is violated.

## Economy
Profits flow from performances, exotic drinks, and fees for use of the bath house. Side income comes from debts, favors, and the information Lira Vott discreetly brokers.

## Culture & Daily Life
The Broadside is equal parts performance hall and game den. Nights blend revelry, danger, and whispered negotiations beneath layers of song, poetry, and stagecraft.

## Notable NPCs
- **Lira Vott, Proprietor**: Former bard, now tavern mistress. Witty, watchful, and a broker of secrets. Her magical and financial debts keep her tethered to Black Brine’s intrigues.
- **Baelin the Quiet, Head Waiter**: Silent, precise, and ever-observant. Known for orchestrating the floor with subtle gestures, protecting patrons’ privacy.

## Adventure Hooks
- A saboteur approaches the party in the Whisper Room, drawing them into political machinations.
- Performances on the Gilded Stage conceal coded messages about an impending betrayal.
- A missing guest may be trapped in the tavern’s shifting enchantments, hinting at a hidden passage or planar crossing.
- Lira’s debts embroil the party in rivalries, assassination plots, or retrieval of cursed relics hidden under the Tideglass Bar.

## Campaign Connections
- Rumors and job offers flow constantly—lost pirate ships, missing maps, and possible portals to the Underdark beneath the tavern floor.
- Zhentarim, Harpers, and pirate crews use the Broadside as a maneuvering ground. Players may choose alliances or investigate disappearances linked to the Whisper Room.
- The tavern is rumored to be built atop an ancient underwater temple. Prophecies foretell the return of a sea deity; storms and strange omens suggest its awakening.

## Secrets & Hidden Information
- The shifting decor is powered by a bound spirit—unhappy, but bound to Lira’s debts. Freeing or bargaining with it could reshape the tavern’s nature.
- Beneath the Tideglass Bar lies a sealed hatch leading to catacombs that may connect to a temple of the Hollow Goddess.