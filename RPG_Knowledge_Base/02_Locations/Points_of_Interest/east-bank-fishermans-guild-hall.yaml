rumors:
  - "Arven Holt secretly plans to merge the guild halls under a single charter, though the West Bank would resist."
  - "Sella Dorn keeps a hidden ledger of bribes paid to Salt Crown officials."
  - "The Captain’s Lounge doubles as a private gambling den for retired captains and harbor guards."
  - "A series of disappearances among dock workers may be linked to late-night meetings at the hall."

atmosphere: >
  The East Bank Guild Hall feels orderly and professional compared to its Crosswater counterpart.
  Lanterns glow in glass sconces, and soft conversation replaces raucous laughter.
  Beneath the civility, however, lies the same salt-scarred determination shared by all who live
  by the river’s mercy.

