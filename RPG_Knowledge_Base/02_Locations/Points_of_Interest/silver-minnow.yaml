rumors:
  - "Helra’s secret glaze recipe was originally stolen from a noble’s kitchen in Baldur’s Gate."
  - "The Minnow’s cellar connects to a smuggler’s tunnel leading beneath the docks."
  - "Cal has been seen leaving the east docks late at night with sealed packages."
  - "A minor noble from Salt Crown keeps the upstairs suite rented year-round, though he’s rarely seen."

atmosphere: >
  Soft candlelight, the hum of the river, and quiet conversation make The Silver Minnow a pocket of peace
  amid Crosswater’s rough edges. Patrons lower their voices instinctively, as if afraid the calm might break.
  Outside, the water glows faintly with lanternlight—silver minnows darting beneath the planks.

