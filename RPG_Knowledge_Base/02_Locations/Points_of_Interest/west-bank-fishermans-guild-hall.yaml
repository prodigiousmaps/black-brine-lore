# West Bank Guild Hall — Guild of Free Fishermen

## Overview
The West Bank Guild Hall serves as both a labor union and a social club for fishers working the southern waters below the Red Chain Bridge. It anchors the Crosswater riverfront with working docks, noisy halls, and the scent of tar and brine.

## Appearance
A broad timber-framed structure built against the docks, its walls hung with old nets and lanterns made from glass buoys. Inside, rough-hewn tables and a low ceiling trap smoke, laughter, and the scent of ale. A wide porch looks over the river, where boats unload daily catch.

## Role in Society
This is the working heart of the Guild of Free Fishermen — equal parts bargaining hall, memorial house, and communal tavern. Members debate prices, share profits, and vote on disputes while songs rise from the drinking hall below.  
The guild acts like a union crossed with a VFW: proud, loud, and loyal to its own.

## Features
- **Guild Drinking Hall:** The social core; loud, smoky, and always alive.  
- **Meeting Hall:** Used for votes, disputes, and memorials for those lost at sea.  
- **Guildmaster’s Office:** Holds ledgers, permits, and disciplinary records.  
- **Docks:** Maintained by guild hands; small boats line the pilings daily.  
- **Fish Market:** Street stalls outside the hall sell fresh catch directly to citizens.

## Notable Figures
- **Garrin “Grayhook” Darral (Guildmaster):** Grizzled veteran with one good eye and an iron hook for a hand; fair-minded and respected by all.  
- **Merra Tollin (Guild Clerk):** Sharp, ink-stained, and quick-witted; manages dues, licenses, and gossip with equal precision.

## Culture
The hall is noisy but disciplined, bound by custom and oath. Arguments often end in laughter or bruises, and every member knows who will stand with them when the tides turn rough.  
A carved plaque near the entrance reads: *“One river, one net.”*

## Adjacent Location — The Silver Minnow
Across the alley lies **The Silver Minnow**, a cozy eatery known for its private booths, brine-glazed trout, and three upstairs rooms (two small, one suite). Fishermen bring their partners here on paydays, and visiting traders rent the rooms to watch the docks at night.

**Proprietor:** Helra Vinn — former fisher turned cook, known for her steady hand and sharp tongue.  
**Staff:** Cal Vinn (server, dockhand) and Pinna Lorr (quiet server rumored to have a smuggler’s past).

## Rumors
- The hall keeps a hidden tunnel beneath the docks for moving contraband or rescuing trapped boats.  
- A ledger of black-market catches is said to be locked in Merra’s desk.  
- Grayhook once served as a privateer for the Council of Free Captains, though he denies it.

