overview: >
  The Guild of Free Fishermen protects the rights and livelihoods of those who fish the southern waters
  below the Red Chain Bridge. Part labor union, part fraternal order, the guild negotiates prices,
  secures permits, settles disputes, and ensures that no member or their family goes hungry after a hard season.

culture_role: >
  Equal parts dockside solidarity and river-forged tradition. The guild keeps memorial rolls for the lost,
  runs wakes and fundraisers, and turns out in force when one of their own is wronged. Its halls double as
  social clubs where veterans teach greenhands and stories grow longer with each tankard.

jurisdiction:
