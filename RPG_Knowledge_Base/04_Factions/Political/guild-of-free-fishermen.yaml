# Overview
Protects rights and livelihoods for fishers south of the Red Chain Bridge; negotiates prices, secures permits, settles disputes, and turns out in force when one of their own is wronged.

# Jurisdiction
**Waters:** South of the Red Chain Bridge.  
**Enforcement:** Licensed member boats only; poachers fined or banned from guild markets.  
**Exceptions:** Storm relief and funerary processions.

# Governance
Guild Council (elected yearly). Two hall masters (West/East) hold local veto.  
- West Bank Guildmaster: **Garrin “Grayhook” Darral**  
- Clerk (West): **Merra Tollin**  
- East Bank Guildmaster: **Arven “Tidewise” Holt**  
- Clerk of Ledgers (East): **Sella Dorn**

# Membership
**Eligibility:** River fishers, deckhands, net-menders, dock stewards; retirees (honorary).  
**Dues:** Weekly coin or in-kind tithe.  
**Benefits:** Market access; strike/injury funds; funeral fund; arbitration.  
**Obligations:** Respect nets and lines; observe seasonal limits; answer the hall bell.

# Operations
**Markets:** West Bank street stalls; East Bank Market Quay.  
**Docks Controlled:** Both halls.  
**Patrols:** Volunteer night watches deter theft and poaching.

# Customs
**Motto:** “No net untended, no fisher left behind.”  
**Rites:** Bell of the Returned; River Wake candle flotillas.  
**Token:** Bronze hook-pin.

# Rumors
- Push to unify both halls.  
- Buyers’ syndicate paying poachers north of the bridge.  
- Cut nets near pilings—signs of trained divers.

